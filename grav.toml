name = "apogee-sanctum"
lib = "src/all.grav"
grav = ">=1.13.0"
paths = ["src"]

[dependencies]
apogee-http = "github.com/venomous-maker/apogee-http@v0.3.0"
apogee-routing = "github.com/venomous-maker/apogee-routing@v0.3.0"
apogee-auth = "github.com/venomous-maker/apogee-auth@v0.2.3"
apogee-config = "github.com/venomous-maker/apogee-config@v0.2.0"
apogee-console = "github.com/venomous-maker/apogee-console@v0.2.4"
apogee-package = "github.com/venomous-maker/apogee-package@v0.1.2"
grav-orbit = "github.com/venomous-maker/grav-orbit@v0.3.1"
grav-db = "github.com/venomous-maker/grav-db@v0.2.1"
grav-cache = "github.com/venomous-maker/grav-cache@v0.2.4"
# (the tests drive the guard through the router)
apogee-container = "github.com/venomous-maker/apogee-container@v0.2.0"
apogee-session = "github.com/venomous-maker/apogee-session@v0.2.3"
apogee-testing = "github.com/venomous-maker/apogee-testing@v0.1.1"
